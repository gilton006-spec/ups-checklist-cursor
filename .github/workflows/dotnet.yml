name: .NET checklist

on:
  push:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet.yml"

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: dotnet
    env:
      E2E_SITE_PASSWORD: e2e-test-only
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dotnet/e2e/package-lock.json

      - name: Restore
        run: dotnet restore UpsChecklist.slnx

      - name: Build
        run: dotnet build UpsChecklist.slnx --configuration Release --no-restore

      - name: .NET tests with coverage
        run: >
          dotnet test UpsChecklist.Tests/UpsChecklist.Tests.csproj
          --configuration Release
          --no-build
          --nologo
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Summarise coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$(find TestResults -name 'coverage.cobertura.xml' | head -n 1 || true)"
          if [[ -z "${file}" ]]; then
            echo "No coverage file found."
            exit 0
          fi
          python3 - <<'PY' "$file"
          import sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          root = ET.parse(path).getroot()
          line = float(root.attrib.get("line-rate", 0)) * 100
          branch = float(root.attrib.get("branch-rate", 0)) * 100
          covered = root.attrib.get("lines-covered", "?")
          valid = root.attrib.get("lines-valid", "?")
          print(f"Line coverage: {line:.1f}% ({covered}/{valid})")
          print(f"Branch coverage: {branch:.1f}%")
          print(f"::notice title=Code coverage::Line {line:.1f}% · Branch {branch:.1f}% ({covered}/{valid} lines)")
          for pkg in root.findall("./packages/package"):
              name = pkg.attrib.get("name", "?")
              pl = float(pkg.attrib.get("line-rate", 0)) * 100
              pb = float(pkg.attrib.get("branch-rate", 0)) * 100
              print(f"  {name}: line {pl:.1f}% · branch {pb:.1f}%")
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-cobertura
          path: dotnet/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Frontend helper tests
        run: node --test tools/ScannerRegressionTests/*.test.mjs

      - name: Scanner PDF / CSRF regression
        run: dotnet run --project tools/ScannerRegressionTests --configuration Release -- /tmp/scanner-pdfs

      - name: Install Playwright dependencies
        working-directory: dotnet/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Playwright E2E
        working-directory: dotnet/e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: |
            dotnet/e2e/playwright-report
            dotnet/e2e/test-results
          if-no-files-found: ignore
